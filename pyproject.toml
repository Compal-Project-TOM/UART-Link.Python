[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uart-link"
version = "0.3.2"
description = "UART communication package for product-specific protocol"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Compal TOM Team" }]
dependencies = ["pyserial>=3.5"]

[project.urls]
Repository = "https://github.com/Compal-Project-TOM/UART-Link.Python"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["uart_link*"]
